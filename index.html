<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>You're Invited 💌</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff3f8);
    overflow: hidden;
}

.invite-card {
    width: 90%;
    max-width: 420px;
    padding: 45px 25px;
    text-align: center;
    background: white;
    border-radius: 25px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.12);
}

h1 {
    font-size: 18px;
    color: #888;
    margin-bottom: 10px;
}

h2 {
    font-size: 28px;
    color: #333;
    margin-bottom: 30px;
}

.details {
    color: #666;
    line-height: 1.7;
    margin-bottom: 30px;
}

.btn-container {
    display: flex;
    justify-content: center;
    gap: 15px;
    position: relative;
}

button {
    border: none;
    padding: 14px 25px;
    border-radius: 50px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

#yesBtn {
    background: #ff6b9a;
    color: white;
}

#yesBtn:hover {
    transform: scale(1.08);
}

#noBtn {
    background: #eee;
    color: #555;
    position: relative;
}

#message {
    display: none;
    margin-top: 25px;
    font-size: 20px;
    color: #ff4f87;
    font-weight: bold;
}

.heart {
    position: fixed;
    font-size: 25px;
    animation: fall 2s linear forwards;
    pointer-events: none;
}

@keyframes fall {
    0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 1;
    }

    100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="invite-card">

    <h1>💌 A Little Invitation</h1>

    <h2>Will you come to my party? 🥺</h2>

    <div class="details">
        📅 Saturday, 10 October<br>
        🕖 7:00 PM<br>
        📍 Somewhere Special
    </div>

    <div class="btn-container">

        <button id="yesBtn" onclick="celebrate()">
            Yes! 🎉
        </button>

        <button id="noBtn">
            No 😭
        </button>

    </div>

    <div id="message">
        YAY!!! See you there! ❤️🎉
    </div>

</div>

<script>

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", function() {

    const x = Math.random() * 250 - 125;
    const y = Math.random() * 150 - 75;

    noBtn.style.transform =
        `translate(${x}px, ${y}px)`;

});

function celebrate() {

    document.getElementById("message").style.display = "block";

    for (let i = 0; i < 30; i++) {

        const heart = document.createElement("div");

        heart.className = "heart";

        heart.innerHTML =
            ["❤️", "💕", "💖", "🎉", "✨"]
            [Math.floor(Math.random() * 5)];

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.animationDuration =
            (1.5 + Math.random() * 2) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 4000);
    }

}

</script>

</body>
</html>
