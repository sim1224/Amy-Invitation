<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Farewell Dinner 💌</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #fff3f8);
}

.invite-card {
    width: 100%;
    max-width: 430px;
    padding: 35px 25px;
    text-align: center;
    background: white;
    border-radius: 28px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.12);
}

h1 {
    font-size: 30px;
    color: #333;
    margin: 0 0 20px;
}

.bubu {
    width: 170px;
    max-width: 70%;
    margin: 5px auto 20px;
    display: block;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

.question {
    font-size: 22px;
    color: #444;
    margin: 20px 0;
    line-height: 1.4;
}

.details {
    color: #666;
    line-height: 1.8;
    font-size: 16px;
    margin-bottom: 25px;
}

.description {
    color: #555;
    font-size: 16px;
    line-height: 1.9;
    margin: 20px 5px 30px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
}

button {
    border: none;
    padding: 13px 25px;
    border-radius: 50px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
}

#yesBtn {
    background: #ff6b9a;
    color: white;
}

#yesBtn:hover {
    transform: scale(1.08);
}

#noBtn {
    background: #eeeeee;
    color: #555;
}

#noBtn:hover {
    transform: scale(1.05);
}

#response {
    display: none;
    margin-top: 25px;
    color: #ff5c8a;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.6;
}

.heart {
    position: fixed;
    font-size: 24px;
    animation: fall 2s linear forwards;
    pointer-events: none;
}

@keyframes fall {
    0% {
        transform: translateY(-30px);
        opacity: 1;
    }

    100% {
        transform: translateY(100vh);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="invite-card">

    <h1>💌 Farewell Dinner</h1>

    <img src="bubu-dudu.png" class="bubu" alt="Bubu & Dudu">

    <div class="question">
        Will you come to my farewell dinner? 🥺
    </div>

    <div class="details">
        📅 <strong>4 October</strong><br>
        🕖 <strong>7:00 PM</strong>
    </div>

    <div class="description">
        想在离开之前，和你一起吃一顿饭。<br>
        不需要特别的理由，只是想好好珍惜这一次见面的机会。❤️
    </div>

    <div class="buttons">

        <button id="yesBtn" onclick="sayYes()">
            Yes! 🎉
        </button>

        <button id="noBtn" onclick="sayNo()">
            No 😭
        </button>

    </div>

    <div id="response"></div>

</div>

<script>

function sayYes() {

    const response = document.getElementById("response");

    response.style.display = "block";

    response.innerHTML =
        "YAY!!! See you there! ❤️🎉";

    createHearts();
}

function sayNo() {

    const response = document.getElementById("response");

    response.style.display = "block";

    response.innerHTML =
        "为什么呀？🥺<br>真的不要来吗？🥹";

}

function createHearts() {

    for (let i = 0; i < 30; i++) {

        const heart = document.createElement("div");

        heart.className = "heart";

        heart.innerHTML =
            ["❤️", "💕", "💖", "🎉", "✨"]
            [Math.floor(Math.random() * 5)];

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.animationDuration =
            (1.5 + Math.random() * 2) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 4000);
    }
}

</script>

</body>
</html>
